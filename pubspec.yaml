name: notes_ddd
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  freezed_annotation: ^3.1.0
  dartz: ^0.10.1
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  meta: ^1.18.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  flutter_dotenv: ^6.0.1
  uuid: ^4.6.0
  auto_route: ^11.1.0
  kt_dart: ^1.1.0
  json_annotation: ^4.12.0
  cloud_firestore: ^6.9.0
  rxdart: ^0.28.0
  flutter_hooks: ^0.21.3+1

dev_dependencies:
  freezed: ^4.0.0-dev.3
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^3.0.2
  auto_route_generator: ^10.5.0
  json_serializable: ^6.14.1

